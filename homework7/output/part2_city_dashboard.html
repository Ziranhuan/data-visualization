<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验七 Part 2 交互图表</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #f7f9fd 0%, #eef3fb 100%);
            color: #1f2937;
        }
        .page {
            max-width: 1480px;
            margin: 0 auto;
        }
        .title {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
            font-size: 16px;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            padding: 16px 18px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }
        .toolbar label {
            font-weight: 600;
        }
        .toolbar select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            min-width: 180px;
            background: #fff;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .tab-btn {
            border: none;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 10px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }
        .tab-btn.active {
            background: #2563eb;
            color: #ffffff;
        }
        .panel {
            display: none;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
            padding: 12px;
        }
        .panel.active {
            display: block;
        }
    </style>

        <div class="toolbar">

            <select id="citySelect"><option value="南昌" selected>南昌</option><option value="上海" >上海</option><option value="广州" >广州</option></select>

        <div class="tabs">
            <button class="tab-btn active" data-target="barPanel">城市对比柱状图</button>
            <button class="tab-btn" data-target="rosePanel">风速玫瑰图</button>
            <button class="tab-btn" data-target="detailPanel">城市气象详情图</button>
        </div>

        <section id="barPanel" class="panel active">
            <div id="compareBar" style="height: 640px;"></div>
        </section>

        <section id="rosePanel" class="panel">
            <div id="windRose" style="height: 680px;"></div>
        </section>

        <section id="detailPanel" class="panel">
            <div id="cityDetail" style="height: 760px;"></div>
